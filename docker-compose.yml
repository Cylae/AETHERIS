# ==============================================================================
# NETWORKS
# ==============================================================================
# We define isolated bridge networks.
# - aetheris_frontend: Used by services directly accessible to the web (proxied).
# - aetheris_backend: Used for internal databases, caching, and secure services.
networks:
  aetheris_frontend:
    driver: bridge
  aetheris_backend:
    driver: bridge

# ==============================================================================
# VOLUMES
# ==============================================================================
# We use named volumes for essential core data persistence.
# For application-specific data, we bind-mount to ${AETHERIS_DATA_DIR}.
volumes:
  npm_data:
  npm_letsencrypt:
  mariadb_data:
  redis_data:
  portainer_data:

# ==============================================================================
# SERVICES
# ==============================================================================
services:

  # ----------------------------------------------------------------------------
  # 1. CORE INGRESS: Nginx Proxy Manager
  # ----------------------------------------------------------------------------
  # Centralized reverse proxy handling automatic Let's Encrypt SSL and routing.
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: aetheris_npm
    restart: always
    ports:
      # These are the ONLY web ports exposed to the host system
      - '80:80'
      - '443:443'
      - '81:81' # Admin port for Nginx Proxy Manager
    environment:
      DB_MYSQL_HOST: mariadb
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
      DB_MYSQL_NAME: npm
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - aetheris_frontend
      - aetheris_backend # Must reach databases
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. CORE DATABASE: MariaDB
  # ----------------------------------------------------------------------------
  # Centralized SQL database for services like NPM, Nextcloud, Gitea, Yourls.
  mariadb:
    image: mariadb:10.11
    container_name: aetheris_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ${AETHERIS_DATA_DIR}/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    networks:
      - aetheris_backend
    # Optimization parameters
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --innodb-file-per-table=1 --skip-host-cache --skip-name-resolve
      --log-warnings=1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. CORE CACHE: Redis
  # ----------------------------------------------------------------------------
  # High-performance key-value store for Nextcloud and others.
  redis:
    image: redis:alpine
    container_name: aetheris_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - aetheris_backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "auth", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. ORCHESTRATION / MANAGEMENT: Portainer
  # ----------------------------------------------------------------------------
  # Web-based management UI for Docker environments.
  portainer:
    image: portainer/portainer-ce:latest
    container_name: aetheris_portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - aetheris_frontend
    # Note: Access via NPM reverse proxy mapping Portainer's internal port (9000).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 5. MAIL: docker-mailserver
  # ----------------------------------------------------------------------------
  # Resolves MIAB conflict: True containerized, modular mail server.
  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: aetheris_mailserver
    hostname: ${MAIL_HOSTNAME}
    domainname: ${DOMAIN_NAME}
    restart: always
    ports:
      - "25:25"     # SMTP
      - "143:143"   # IMAP
      - "587:587"   # Submission
      - "993:993"   # IMAPS
    environment:
      DMS_DEBUG: ${DMS_DEBUG:-0}
      ENABLE_POSTGREY: 0
      ONE_DIR: 1
      POSTMASTER_ADDRESS: ${POSTMASTER_ADDRESS}
      ENABLE_CLAMAV: ${ENABLE_CLAMAV:-1}
      ENABLE_SPAMASSASSIN: ${ENABLE_SPAMASSASSIN:-1}
      ENABLE_FAIL2BAN: ${ENABLE_FAIL2BAN:-1}
    volumes:
      - ${AETHERIS_DATA_DIR}/mailserver/mail-data:/var/mail
      - ${AETHERIS_DATA_DIR}/mailserver/mail-state:/var/mail-state
      - ${AETHERIS_DATA_DIR}/mailserver/mail-logs:/var/log/mail
      - ${AETHERIS_DATA_DIR}/mailserver/config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN  # Required for fail2ban
    security_opt:
      - no-new-privileges:true
    networks:
      - aetheris_backend # No direct web exposure needed; accessed via roundcube or externally via mapped ports
    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 6. WEBMAIL: Roundcube
  # ----------------------------------------------------------------------------
  # Web interface for the mail server, isolated from the host via proxy.
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: aetheris_roundcube
    restart: always
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_DEFAULT_HOST: tls://mailserver
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT: 587
    volumes:
      - ${AETHERIS_DATA_DIR}/roundcube/db:/var/roundcube/db
      - ${AETHERIS_DATA_DIR}/roundcube/config:/var/roundcube/config
    networks:
      - aetheris_frontend # Reached via proxy
      - aetheris_backend  # Needs to reach mailserver
    depends_on:
      mailserver:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 7. APPS: Nextcloud
  # ----------------------------------------------------------------------------
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: aetheris_nextcloud
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: redis
    volumes:
      - ${AETHERIS_DATA_DIR}/nextcloud:/config
      - ${AETHERIS_MEDIA_DIR}:/data
    networks:
      - aetheris_frontend
      - aetheris_backend
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 8. APPS: Gitea
  # ----------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:latest
    container_name: aetheris_gitea
    restart: always
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      GITEA__database__DB_TYPE: mysql
      GITEA__database__HOST: mariadb:3306
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
    volumes:
      - ${AETHERIS_DATA_DIR}/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2222:22" # Expose SSH port for Git
    networks:
      - aetheris_frontend
      - aetheris_backend
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 9. APPS: Vaultwarden
  # ----------------------------------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: aetheris_vaultwarden
    restart: always
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ${AETHERIS_DATA_DIR}/vaultwarden:/data
    networks:
      - aetheris_frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 10. APPS: Yourls
  # ----------------------------------------------------------------------------
  yourls:
    image: yourls:latest
    container_name: aetheris_yourls
    restart: always
    environment:
      YOURLS_DB_HOST: mariadb
      YOURLS_DB_USER: yourls
      YOURLS_DB_PASS: ${YOURLS_DB_PASSWORD}
      YOURLS_DB_NAME: yourls
      YOURLS_USER: admin
      YOURLS_PASS: ${YOURLS_ADMIN_PASSWORD}
    volumes:
      - ${AETHERIS_DATA_DIR}/yourls:/var/www/html
    networks:
      - aetheris_frontend
      - aetheris_backend
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 11. MONITORING: Prometheus
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: aetheris_prometheus
    restart: always
    volumes:
      - ${AETHERIS_DATA_DIR}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${AETHERIS_DATA_DIR}/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - aetheris_backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 12. MONITORING: NodeExporter
  # ----------------------------------------------------------------------------
  node_exporter:
    image: prom/node-exporter:latest
    container_name: aetheris_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - aetheris_backend

  # ----------------------------------------------------------------------------
  # 13. MONITORING: cAdvisor
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: aetheris_cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - aetheris_backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 14. MONITORING: Grafana
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: aetheris_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${AETHERIS_DATA_DIR}/grafana:/var/lib/grafana
    networks:
      - aetheris_frontend
      - aetheris_backend
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 15. AUTOMATION: Watchtower
  # ----------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: aetheris_watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --schedule "0 0 4 * * *" --cleanup

  # ----------------------------------------------------------------------------
  # 16. FRONTEND: AETHERIS Dashboard
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: aetheris_dashboard
    restart: always
    networks:
      - aetheris_frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
